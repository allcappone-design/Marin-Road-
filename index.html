<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>MARIN ROAD MAP</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0;background:#111}#map{position:absolute;inset:0}.panel{position:absolute;z-index:1000;top:12px;left:12px;right:12px;background:#111e;color:white;border:2px solid #15a8ff;border-radius:14px;padding:12px;font:15px system-ui;box-shadow:0 2px 15px #0008}.panel h2{margin:0 0 8px;color:#fff;font-size:19px}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}button,select,input{border-radius:9px;padding:9px;font-size:14px}button{background:#b76cff;color:#111;border:0;font-weight:bold}input{width:calc(100% - 20px);margin-top:7px}.legend{font-size:13px;margin-top:8px}.legend b{padding:2px 6px;border-radius:4px;color:#111}.note{font-size:11px;color:#ddd;margin-top:6px}</style></head><body><div id="map"></div><div class="panel"><h2>🚛 MARIN ROAD MAP 🛰️</h2><div>Europa · satelit · drumuri colorate</div><div class="legend"><b style="background:#00ec65">A</b> Autostradă <b style="background:#24a4ff">B</b> Drum principal <b style="background:#ffe600">L</b> Drum regional <b style="background:#ff3b3b">K</b> Drum local</div><input id="dest" placeholder="Destinație: adresă sau localitate"><div class="buttons"><button onclick="locate()">📍 Poziția mea</button><button onclick="findDest()">🔎 Caută</button><button onclick="nav('google')">Google Maps</button><button onclick="nav('tomtom')">TomTom</button><button onclick="speak()">🔊 Voce haioasă</button></div><div class="note" id="status">Hartă europeană demonstrativă. Culorile nu garantează accesul camioanelor; verifică restricțiile.</div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const m=L.map('map',{zoomControl:false}).setView([51.2,10.45],6);L.control.zoom({position:'bottomright'}).addTo(m);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Imagery © Esri and providers',maxZoom:19}).addTo(m);let marker,destination;let roads=L.layerGroup().addTo(m);let timer;function status(t){document.getElementById('status').textContent=t}function locate(){if(!navigator.geolocation){status('GPS indisponibil');return}navigator.geolocation.getCurrentPosition(p=>{let ll=[p.coords.latitude,p.coords.longitude];if(marker)marker.setLatLng(ll);else marker=L.marker(ll).addTo(m).bindPopup('Poziția mea');m.setView(ll,15)},()=>status('Permite accesul la locație în browser.'),{enableHighAccuracy:true})}async function findDest(){let q=document.getElementById('dest').value.trim();if(!q)return;try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));let a=await r.json();if(!a.length)throw Error();destination=[+a[0].lat,+a[0].lon];m.setView(destination,14);L.marker(destination).addTo(m).bindPopup(q).openPopup();status('Destinație găsită. Alege navigatorul.')}catch(e){status('Nu am găsit destinația.')}}function nav(which){if(!destination){status('Caută întâi o destinație.');return}let ll=destination.join(',');if(which==='google')window.open('https://www.google.com/maps/dir/?api=1&destination='+ll+'&travelmode=driving','_blank');else{navigator.clipboard?.writeText(ll);status('Coordonatele destinației au fost copiate. Deschide TomTom GO și introdu destinația.');window.open('https://plan.tomtom.com/','_blank')}}function speak(){let s=new SpeechSynthesisUtterance('No, măi laie, ține bine de covrig! La dreapta când îți spune navigatorul, nu când cântă cocoșul!');s.lang='ro-RO';s.rate=.88;s.pitch=.7;speechSynthesis.speak(s)}function cls(tags){let h=tags.highway||'',ref=tags.ref||'';if(h==='motorway'||h==='motorway_link')return '#00ec65';if(/^(B\s?\d+)/i.test(ref))return '#24a4ff';if(/^(L\s?\d+)/i.test(ref))return '#ffe600';if(/^(K\s?\d+)/i.test(ref))return '#ff3b3b';if(h==='trunk'||h==='trunk_link'||h==='primary'||h==='primary_link')return '#24a4ff';if(h==='secondary'||h==='secondary_link')return '#ffe600';if(h==='tertiary'||h==='tertiary_link')return '#ff3b3b';return null}let requestId=0;const overpassServers=['https://overpass.private.coffee/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass-api.de/api/interpreter'];
async function loadRoads(){clearTimeout(timer);const id=++requestId;let b=m.getBounds();if(m.getZoom()<9){roads.clearLayers();status('Mărește harta la nivelul 9: drumurile se colorează la apropiere.');return}let bounds=[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()];if((bounds[2]-bounds[0])*(bounds[3]-bounds[1])>1){roads.clearLayers();status('Mărește harta pentru afișarea drumurilor.');return}
status('Se încarcă drumurile colorate…');timer=setTimeout(async()=>{const bbox=bounds.map(n=>n.toFixed(5)).join(',');const q=`[out:json][timeout:25];way["highway"~"^(motorway|motorway_link|trunk|trunk_link|primary|primary_link|secondary|secondary_link|tertiary|tertiary_link)$"](${bbox});out geom;`;
for(const endpoint of overpassServers){if(id!==requestId)return;const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),14000);try{const r=await fetch(endpoint+'?data='+encodeURIComponent(q),{signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(id!==requestId)return;if(!Array.isArray(data.elements))throw Error('Invalid response');roads.clearLayers();let count=0;data.elements.forEach(e=>{let c=cls(e.tags||{});if(c&&e.geometry){L.polyline(e.geometry.map(p=>[p.lat,p.lon]),{color:c,weight:5,opacity:.92,interactive:false}).addTo(roads);count++}});status(count?'Drumuri colorate afișate ('+count+'). Date OpenStreetMap; verifică separat restricțiile pentru camioane.':'Nu sunt drumuri clasificate în această zonă.');return}catch(e){if(id!==requestId)return}finally{clearTimeout(timeout)}}if(id===requestId)status('Serverele pentru drumuri nu răspund acum. Încearcă din nou peste câteva minute.');},650)}
m.on('moveend',loadRoads);loadRoads();</script></body></html>
